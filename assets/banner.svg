<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Blur Filter for Dynamic Glowing Orbs -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
      50% { transform: translate(80px, 40px) scale(1.25); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1.1); opacity: 0.4; }
      50% { transform: translate(-60px, -30px) scale(0.9); opacity: 0.65; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(420px); opacity: 0.2; }
    }
    @keyframes floatShield {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    .dynamic-orb-1 {
      animation: pulseOrb1 9s ease-in-out infinite;
    }
    .dynamic-orb-2 {
      animation: pulseOrb2 11s ease-in-out infinite;
    }
    .dynamic-scan {
      animation: scanLine 8s linear infinite;
    }
    .dynamic-shield {
      animation: floatShield 6s ease-in-out infinite;
      transform-origin: 1020px 210px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="dynamic-orb-1" cx="200" cy="120" r="160" fill="#38bdf8" />
    <circle class="dynamic-orb-2" cx="1000" cy="300" r="180" fill="#818cf8" />
    <circle class="dynamic-orb-1" cx="700" cy="80" r="130" fill="#c084fc" opacity="0.3" />
  </g>

  <!-- Digital Circuit Pattern Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Scanning Beam (Behind Text) -->
  <line class="dynamic-scan" x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Decorative Floating Shield / Governance Crest on the Right (Background Art) -->
  <g class="dynamic-shield">
    <polygon points="1020,90 1110,135 1110,240 1020,310 930,240 930,135" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" filter="url(#subtleGlow)" />
    <!-- Inner Circuit Lines inside Crest -->
    <path d="M 1020 120 L 1020 280 M 960 170 L 1080 170 M 960 230 L 1080 230" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="4 4" />
    <circle cx="1020" cy="200" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Lock / Check Icon Inside Crest -->
    <path d="M 1012 201 L 1018 207 L 1030 193" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, and Feature Badges (Always on top) -->
  <g id="foreground-content">
    <!-- Tagline Badge -->
    <g transform="translate(80, 70)">
      <rect width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="18" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="21" class="tagline-text">Curated Enterprise &amp; Open-Source</text>
    </g>

    <!-- Main Title -->
    <text x="80" y="150" class="title-text">
      Awesome <tspan fill="url(#accentGrad)">AI Governance</tspan> &amp; Compliance
    </text>

    <!-- Subtitle -->
    <text x="80" y="196" class="subtitle-text">
      EU AI Act • NIST AI RMF • ISO 42001 • Risk Classification &amp; Audit Evidence
    </text>

    <!-- Secondary descriptive line -->
    <text x="80" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#cbd5e1" font-weight="400">
      A definitive handbook comparing enterprise SaaS platforms and battle-tested open-source frameworks.
    </text>

    <!-- Foreground Feature Pills -->
    <g transform="translate(80, 275)">
      <!-- Pill 1: EU AI Act -->
      <g transform="translate(0, 0)">
        <rect width="140" height="38" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
        <text x="70" y="24" text-anchor="middle" class="pill-text">🇪🇺 EU AI Act</text>
      </g>

      <!-- Pill 2: NIST AI RMF -->
      <g transform="translate(155, 0)">
        <rect width="145" height="38" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
        <text x="72" y="24" text-anchor="middle" class="pill-text">🏛️ NIST AI RMF</text>
      </g>

      <!-- Pill 3: ISO 42001 -->
      <g transform="translate(315, 0)">
        <rect width="135" height="38" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.2" />
        <text x="67" y="24" text-anchor="middle" class="pill-text">📜 ISO 42001</text>
      </g>

      <!-- Pill 4: Agent Oversight -->
      <g transform="translate(465, 0)">
        <rect width="165" height="38" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#2dd4bf" stroke-width="1.2" />
        <text x="82" y="24" text-anchor="middle" class="pill-text">🤖 Agent Oversight</text>
      </g>

      <!-- Pill 5: Audit Evidence -->
      <g transform="translate(645, 0)">
        <rect width="150" height="38" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#fb7185" stroke-width="1.2" />
        <text x="75" y="24" text-anchor="middle" class="pill-text">🔍 Audit Trails</text>
      </g>
    </g>
  </g>
</svg>
